{% load static %}

<div
    id="arolana-smartchat-widget"
    class="fixed bottom-6 right-6 z-[99999]"
    data-message-url="{% url 'smartchat:api_message' %}"
    data-poll-url="{% url 'smartchat:api_poll' %}"
    data-typing-url="{% url 'smartchat:api_typing' %}"
    data-request-admin-url="{% url 'smartchat:api_request_admin' %}"
    data-admin-inbox-url="{% url 'smartchat:admin_inbox' %}"
    data-product-id="{% if product %}{{ product.id }}{% endif %}"
    data-product-name="{% if product %}{{ product.name|escape }}{% endif %}"
    data-product-sku="{% if product %}{{ product.sku|escape }}{% endif %}"
>
    <div
        id="arolana-smartchat-panel"
        class="hidden mb-4 w-[calc(100vw-2rem)] max-w-sm overflow-hidden rounded-2xl bg-white shadow-2xl border border-gray-200"
        style="animation: arolanaSmartChatIn .22s ease-out; transform-origin: bottom right;"
    >
        <div class="bg-gradient-to-r from-blue-600 via-purple-600 to-indigo-600 p-4 text-white">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="relative flex h-11 w-11 items-center justify-center rounded-full bg-white/15 backdrop-blur-md shrink-0">
                        <i class="fas fa-robot text-xl"></i>
                        <span class="absolute -right-0.5 -top-0.5 h-3 w-3 rounded-full border-2 border-white bg-green-400"></span>
                    </div>
                    <div class="min-w-0">
                        <p class="font-bold leading-tight truncate">Arolana AI Assistant</p>
                        <p id="arolana-smartchat-subtitle" class="text-xs text-white/85 truncate">
                            Smart support • Admin handoff available
                        </p>
                    </div>
                </div>

                <button
                    type="button"
                    onclick="window.ArolanaSmartChatNoRefresh.close()"
                    class="flex h-9 w-9 items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition shrink-0"
                    aria-label="Close AI chat"
                >
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <div
            id="arolana-smartchat-messages"
            class="h-80 overflow-y-auto bg-gray-50 p-4 space-y-3"
            data-last-message-id="0"
            style="scrollbar-width: thin; scrollbar-color: #8b5cf6 #f1f5f9;"
        >
            <div class="arolana-chat-bubble arolana-chat-bot rounded-2xl rounded-tl-md px-4 py-3 text-sm shadow-sm bg-gray-100 text-gray-900 max-w-[86%]">
                Hi! I’m Arolana AI. I can help with products, orders, delivery, vendors, payments, or connect you to an admin.
            </div>
        </div>

        <div id="arolana-smartchat-admin-status" class="hidden border-t border-yellow-200 bg-yellow-50 px-4 py-2 text-xs text-yellow-800">
            <i class="fas fa-headset mr-1"></i>
            Admin support requested. Keep this chat open for replies.
        </div>

        <div id="arolana-smartchat-typing" class="hidden border-t border-emerald-100 bg-emerald-50 px-4 py-2 text-xs font-semibold text-emerald-800">
            <span class="arolana-chat-typing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
            <span id="arolana-smartchat-typing-text">Arolana Admin is typing...</span>
        </div>

        <div class="arolana-smartchat-compose border-t bg-white p-3">
            <div class="mb-3 flex flex-wrap gap-2">
                <button type="button" class="arolana-smartchat-quick rounded-full bg-blue-50 px-3 py-1.5 text-xs font-semibold text-blue-700 hover:bg-blue-100" data-prompt="I need help with this product.">Product help</button>
                <button type="button" class="arolana-smartchat-quick rounded-full bg-purple-50 px-3 py-1.5 text-xs font-semibold text-purple-700 hover:bg-purple-100" data-prompt="I want to speak with an admin.">Talk to admin</button>
                <button type="button" class="arolana-smartchat-quick rounded-full bg-green-50 px-3 py-1.5 text-xs font-semibold text-green-700 hover:bg-green-100" data-prompt="Tell me about delivery and payment options.">Delivery</button>
            </div>

            <div id="arolana-smartchat-form" class="flex items-center gap-2">
                <input
                    id="arolana-smartchat-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Ask Arolana AI..."
                    class="min-w-0 flex-1 rounded-xl border border-gray-300 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                    onkeydown="if(event.key === 'Enter'){event.preventDefault(); window.ArolanaSmartChatNoRefresh.sendFromInput();}"
                >
                <button
                    type="button"
                    id="arolana-smartchat-send"
                    onclick="window.ArolanaSmartChatNoRefresh.sendFromInput()"
                    class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg hover:scale-105 transition shrink-0"
                    aria-label="Send AI chat message"
                >
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

            <button
                type="button"
                id="arolana-smartchat-admin-btn"
                onclick="window.ArolanaSmartChatNoRefresh.requestAdmin()"
                class="mt-3 w-full rounded-xl bg-gray-100 px-4 py-2 text-xs font-bold text-gray-700 hover:bg-gray-200 transition"
            >
                <i class="fas fa-headset mr-1"></i>
                Request admin support
            </button>
        </div>
    </div>

    <div class="group relative ml-auto h-16 w-16">
        <div class="absolute inset-0 rounded-full bg-gradient-to-r from-blue-600 via-purple-600 to-indigo-600 blur-xl opacity-40 group-hover:opacity-70 transition duration-500 animate-pulse"></div>
        <button
            id="arolana-smartchat-toggle"
            type="button"
            onclick="window.ArolanaSmartChatNoRefresh.open()"
            aria-label="Open Arolana AI Chat"
            aria-expanded="false"
            class="relative flex h-16 w-16 items-center justify-center overflow-hidden rounded-full border border-white/20 bg-gradient-to-r from-blue-600 via-purple-600 to-indigo-600 text-white shadow-2xl backdrop-blur-md transition-all duration-300 hover:scale-110 hover:shadow-purple-500/40 active:scale-95"
        >
            <span class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition duration-500"></span>
            <i id="arolana-smartchat-toggle-icon" class="fas fa-comment-dots text-2xl relative z-10"></i>
            <span class="absolute top-1 right-1 flex h-4 w-4">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex h-4 w-4 rounded-full border-2 border-white bg-green-500"></span>
            </span>
        </button>
        <div class="pointer-events-none absolute bottom-20 right-0 translate-y-2 opacity-0 transition-all duration-300 group-hover:translate-y-0 group-hover:opacity-100">
            <div class="whitespace-nowrap rounded-xl bg-black/90 px-4 py-2 text-sm text-white shadow-xl">Chat with Arolana AI</div>
        </div>
    </div>
</div>

<style>
    @keyframes arolanaSmartChatIn {
        from { opacity: 0; transform: translateY(14px) scale(.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .arolana-chat-bubble {
        word-break: break-word;
        white-space: pre-wrap;
    }

    .arolana-chat-user {
        margin-left: auto;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: #fff;
        max-width: 86%;
    }

    .arolana-chat-bot {
        margin-right: auto;
        background: #f3f4f6;
        color: #111827;
        max-width: 86%;
    }

    .arolana-chat-admin {
        margin-right: auto;
        background: #ecfdf5;
        color: #064e3b;
        border: 1px solid #bbf7d0;
        max-width: 86%;
    }

    .arolana-chat-system {
        margin-right: auto;
        background: #fffbeb;
        color: #92400e;
        border: 1px solid #fde68a;
        max-width: 92%;
        font-size: 12px;
    }

    .arolana-chat-typing-dots {
        display: inline-flex;
        gap: 3px;
        margin-right: 6px;
        vertical-align: middle;
    }

    .arolana-chat-typing-dots span {
        animation: arolanaSmartChatTyping 1s infinite ease-in-out;
        background: currentColor;
        border-radius: 999px;
        height: 5px;
        opacity: .45;
        width: 5px;
    }

    .arolana-chat-typing-dots span:nth-child(2) { animation-delay: .15s; }
    .arolana-chat-typing-dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes arolanaSmartChatTyping {
        0%, 80%, 100% { transform: translateY(0); opacity: .35; }
        40% { transform: translateY(-3px); opacity: 1; }
    }

    @media (max-width: 640px) {
        #arolana-smartchat-widget {
            bottom: max(0.75rem, env(safe-area-inset-bottom));
            left: 0.75rem;
            right: 0.75rem;
        }

        #arolana-smartchat-panel {
            border-radius: 1.25rem;
            margin-bottom: 0.75rem;
            max-height: min(78vh, 660px);
            max-width: none;
            width: 100%;
        }

        #arolana-smartchat-messages {
            height: min(52vh, 420px);
            padding: 0.85rem;
        }

        .arolana-smartchat-compose {
            padding: 0.75rem;
        }

        #arolana-smartchat-form {
            align-items: stretch;
        }

        #arolana-smartchat-input {
            min-height: 46px;
            padding-left: 0.85rem;
            padding-right: 0.85rem;
        }

        #arolana-smartchat-send {
            height: 46px;
            width: 46px;
        }

        #arolana-smartchat-admin-btn {
            min-height: 42px;
        }

        #arolana-smartchat-widget > .group {
            height: 3.75rem;
            margin-left: auto;
            width: 3.75rem;
        }

        #arolana-smartchat-toggle {
            height: 3.75rem;
            width: 3.75rem;
        }

        #arolana-smartchat-toggle-icon {
            font-size: 1.35rem;
        }

        .arolana-smartchat-quick {
            flex: 1 1 auto;
            min-height: 34px;
            text-align: center;
        }

        .arolana-chat-bubble,
        .arolana-chat-user,
        .arolana-chat-bot,
        .arolana-chat-admin {
            max-width: 92%;
        }
    }

    @media (max-width: 380px) {
        #arolana-smartchat-messages {
            height: min(48vh, 360px);
        }
    }
</style>

<script>
(function () {
    "use strict";

    const state = {
        conversationId: localStorage.getItem("arolanaSmartChatConversationId") || "",
        lastMessageId: Number(localStorage.getItem("arolanaSmartChatLastMessageId") || 0),
        pollingTimer: null,
        typingStopTimer: null,
        typingPingTimer: null,
        typingActive: false,
        busy: false
    };

    if (!Number.isFinite(state.lastMessageId)) {
        state.lastMessageId = 0;
        localStorage.setItem("arolanaSmartChatLastMessageId", "0");
    }

    function getEl(id) {
        return document.getElementById(id);
    }

    function widget() {
        return getEl("arolana-smartchat-widget");
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
        return "";
    }

    function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, function (char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }

    function scrollMessages() {
        const box = getEl("arolana-smartchat-messages");
        if (box) box.scrollTop = box.scrollHeight;
    }

    function updateLastMessageId(rawId) {
        const numericId = Number(rawId);
        if (!Number.isFinite(numericId) || numericId <= 0) return;

        state.lastMessageId = Math.max(state.lastMessageId || 0, numericId);
        localStorage.setItem("arolanaSmartChatLastMessageId", String(state.lastMessageId));

        const box = getEl("arolana-smartchat-messages");
        if (box) box.dataset.lastMessageId = String(state.lastMessageId);
    }

    function renderMessage(message, options) {
        options = options || {};
        const box = getEl("arolana-smartchat-messages");
        if (!box || !message) return;

        const numericId = Number(message.id);
        const hasNumericId = Number.isFinite(numericId) && numericId > 0;

        if (hasNumericId && document.querySelector(`[data-arolana-message-id="${numericId}"]`)) {
            updateLastMessageId(numericId);
            return;
        }

        if (options.updateOnly) {
            if (hasNumericId) updateLastMessageId(numericId);
            return;
        }

        const senderType = message.sender_type || "ai";
        let bubbleClass = "arolana-chat-bot";
        let senderName = message.sender_name || "Arolana AI";

        if (senderType === "user") {
            bubbleClass = "arolana-chat-user";
            senderName = "You";
        } else if (senderType === "admin") {
            bubbleClass = "arolana-chat-admin";
            senderName = message.sender_name || "Arolana Admin";
        } else if (senderType === "system") {
            bubbleClass = "arolana-chat-system";
            senderName = "System";
        }

        const bubble = document.createElement("div");
        bubble.className = `arolana-chat-bubble ${bubbleClass} rounded-2xl px-4 py-3 text-sm shadow-sm`;

        if (hasNumericId) {
            bubble.dataset.arolanaMessageId = String(numericId);
        }

        bubble.innerHTML = `
            <div class="text-[11px] font-bold opacity-70 mb-1">${escapeHtml(senderName)}</div>
            <div>${escapeHtml(message.message || message.reply || "")}</div>
        `;

        box.appendChild(bubble);
        scrollMessages();

        if (hasNumericId) updateLastMessageId(numericId);
    }

    function setBusy(isBusy) {
        state.busy = isBusy;

        const send = getEl("arolana-smartchat-send");
        const input = getEl("arolana-smartchat-input");

        if (send) {
            send.disabled = isBusy;
            send.innerHTML = isBusy
                ? '<i class="fas fa-spinner fa-spin"></i>'
                : '<i class="fas fa-paper-plane"></i>';
        }

        if (input) input.disabled = isBusy;
    }

    function setTypingVisible(payload) {
        const indicator = getEl("arolana-smartchat-typing");
        const text = getEl("arolana-smartchat-typing-text");
        if (!indicator) return;

        if (payload && payload.is_typing) {
            if (text) text.textContent = `${payload.name || "Arolana Admin"} is typing...`;
            indicator.classList.remove("hidden");
        } else {
            indicator.classList.add("hidden");
        }
    }

    async function sendTyping(isTyping) {
        const w = widget();
        if (!w || !state.conversationId) return;

        try {
            await fetch(w.dataset.typingUrl || "/smartchat/api/typing/", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                    "X-Requested-With": "XMLHttpRequest"
                },
                body: JSON.stringify({
                    conversation_id: state.conversationId,
                    is_typing: Boolean(isTyping)
                })
            });
        } catch (error) {
            console.warn("Arolana SmartChat typing signal failed:", error);
        }
    }

    function noteCustomerTyping() {
        if (!state.conversationId) return;

        if (!state.typingActive) {
            state.typingActive = true;
            sendTyping(true);
        }

        clearTimeout(state.typingStopTimer);
        state.typingStopTimer = setTimeout(function () {
            state.typingActive = false;
            sendTyping(false);
        }, 1800);

        if (!state.typingPingTimer) {
            state.typingPingTimer = setTimeout(function () {
                state.typingPingTimer = null;
                if (state.typingActive) sendTyping(true);
            }, 2500);
        }
    }

    function selectedVariants() {
        const payload = getEl("selected_variant_payload");

        if (payload && payload.value) {
            try {
                return JSON.parse(payload.value);
            } catch (error) {
                return {};
            }
        }

        const single = getEl("selected_variant_id");
        if (single && single.value) {
            return { selected: single.value };
        }

        return {};
    }

    function productContext() {
        const w = widget();

        const pageSku = getEl("product-sku") ? getEl("product-sku").textContent.trim() : "";
        const pageTitle = document.querySelector("h1") ? document.querySelector("h1").textContent.trim() : "";

        return {
            product_id: w?.dataset.productId || null,
            product_name: w?.dataset.productName || pageTitle || "",
            sku: w?.dataset.productSku || pageSku || "",
            selected_variants: selectedVariants(),
            page_url: window.location.href
        };
    }

    function open() {
        const panel = getEl("arolana-smartchat-panel");
        const toggle = getEl("arolana-smartchat-toggle");
        const icon = getEl("arolana-smartchat-toggle-icon");
        const input = getEl("arolana-smartchat-input");

        if (!panel) return;

        panel.classList.remove("hidden");

        if (toggle) toggle.setAttribute("aria-expanded", "true");
        if (icon) icon.className = "fas fa-times text-2xl relative z-10";

        setTimeout(function () {
            if (input) input.focus();
        }, 80);

        startPolling();
        if (state.conversationId) poll();
    }

    function close() {
        const panel = getEl("arolana-smartchat-panel");
        const toggle = getEl("arolana-smartchat-toggle");
        const icon = getEl("arolana-smartchat-toggle-icon");

        if (!panel) return;

        panel.classList.add("hidden");

        if (toggle) toggle.setAttribute("aria-expanded", "false");
        if (icon) icon.className = "fas fa-comment-dots text-2xl relative z-10";
    }

    function sendFromInput() {
        const input = getEl("arolana-smartchat-input");
        if (!input) return;

        const message = input.value.trim();
        if (!message) return;

        input.value = "";
        state.typingActive = false;
        clearTimeout(state.typingStopTimer);
        sendTyping(false);
        send(message);
    }

    async function send(text) {
        const w = widget();

        if (!w || !text || state.busy) return;

        renderMessage({
            sender_type: "user",
            sender_name: "You",
            message: text
        });

        setBusy(true);

        try {
            const response = await fetch(w.dataset.messageUrl || "/smartchat/api/message/", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                    "X-Requested-With": "XMLHttpRequest"
                },
                body: JSON.stringify({
                    conversation_id: state.conversationId || "",
                    message: text,
                    ...productContext()
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || data.message || "Message could not be sent.");
            }

            if (data.conversation_id) {
                state.conversationId = String(data.conversation_id);
                localStorage.setItem("arolanaSmartChatConversationId", state.conversationId);
            }

            if (data.status === "admin_requested" || data.status === "admin_active" || data.handoff_requested) {
                const status = getEl("arolana-smartchat-admin-status");
                if (status) status.classList.remove("hidden");
            }

            if (Array.isArray(data.messages)) {
                data.messages.forEach(function (msg) {
                    if (msg.sender_type === "user") {
                        renderMessage(msg, { updateOnly: true });
                    } else {
                        renderMessage(msg);
                    }
                });
            } else if (data.reply) {
                renderMessage({
                    sender_type: "ai",
                    sender_name: "Arolana AI",
                    message: data.reply
                });
            }

            startPolling();
            setTimeout(poll, 700);

        } catch (error) {
            renderMessage({
                sender_type: "ai",
                sender_name: "Arolana AI",
                message: error.message || "I could not send that message. Please try again."
            });
        } finally {
            setBusy(false);
        }
    }

    async function requestAdmin() {
        const w = widget();
        if (!w || state.busy) return;

        setBusy(true);

        try {
            const response = await fetch(w.dataset.requestAdminUrl || "/smartchat/api/request-admin/", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                    "X-Requested-With": "XMLHttpRequest"
                },
                body: JSON.stringify({
                    conversation_id: state.conversationId || "",
                    message: "Customer requested admin support.",
                    ...productContext()
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || data.message || "Could not request admin.");
            }

            if (data.conversation_id) {
                state.conversationId = String(data.conversation_id);
                localStorage.setItem("arolanaSmartChatConversationId", state.conversationId);
            }

            const status = getEl("arolana-smartchat-admin-status");
            if (status) status.classList.remove("hidden");

            renderMessage({
                sender_type: "system",
                sender_name: "System",
                message: data.reply || "Admin support has been requested."
            });

            startPolling();
            setTimeout(poll, 700);

        } catch (error) {
            renderMessage({
                sender_type: "system",
                sender_name: "System",
                message: error.message || "Unable to request admin support."
            });
        } finally {
            setBusy(false);
        }
    }

    async function poll() {
        const w = widget();
        if (!w || !state.conversationId) return;

        if (!Number.isFinite(state.lastMessageId)) {
            state.lastMessageId = 0;
            localStorage.setItem("arolanaSmartChatLastMessageId", "0");
        }

        try {
            const url = `${w.dataset.pollUrl || "/smartchat/api/poll/"}?conversation_id=${encodeURIComponent(state.conversationId)}&after_id=${encodeURIComponent(state.lastMessageId || 0)}`;
            const response = await fetch(url, {
                credentials: "same-origin",
                headers: { "X-Requested-With": "XMLHttpRequest" }
            });

            if (!response.ok) return;

            const data = await response.json();

            if (data.status === "admin_requested" || data.status === "admin_active") {
                const status = getEl("arolana-smartchat-admin-status");
                if (status) status.classList.remove("hidden");
            }

            setTypingVisible(data.typing);

            if (Array.isArray(data.messages)) {
                data.messages.forEach(function (msg) {
                    renderMessage(msg);
                });
            }

        } catch (error) {
            console.warn("Arolana SmartChat poll failed:", error);
        }
    }

    function startPolling() {
        if (state.pollingTimer) return;

        state.pollingTimer = setInterval(function () {
            const panel = getEl("arolana-smartchat-panel");
            if (panel && !panel.classList.contains("hidden") && state.conversationId) {
                poll();
            }
        }, 2500);

        if (state.conversationId) poll();
    }

    function bind() {
        const input = getEl("arolana-smartchat-input");
        const sendButton = getEl("arolana-smartchat-send");
        const adminBtn = getEl("arolana-smartchat-admin-btn");

        if (sendButton) {
            sendButton.addEventListener("click", function (event) {
                event.preventDefault();
                event.stopPropagation();
                sendFromInput();
            }, true);
        }

        if (input) {
            input.addEventListener("input", noteCustomerTyping);
            input.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    event.stopPropagation();
                    sendFromInput();
                }
            }, true);
        }

        document.querySelectorAll(".arolana-smartchat-quick").forEach(function (button) {
            button.addEventListener("click", function (event) {
                event.preventDefault();
                event.stopPropagation();

                const prompt = this.dataset.prompt || this.textContent.trim();
                if (!prompt) return;

                open();
                send(prompt);
            }, true);
        });

        if (adminBtn) {
            adminBtn.addEventListener("click", function (event) {
                event.preventDefault();
                event.stopPropagation();
                open();
                requestAdmin();
            }, true);
        }

        document.addEventListener("click", function (event) {
            const toggle = event.target.closest("#arolana-smartchat-toggle");
            if (!toggle) return;

            event.preventDefault();
            event.stopPropagation();
            open();
        }, true);

        if (state.conversationId) startPolling();
    }

    function resetConversation() {
        state.conversationId = "";
        state.lastMessageId = 0;
        localStorage.removeItem("arolanaSmartChatConversationId");
        localStorage.setItem("arolanaSmartChatLastMessageId", "0");
    }

    window.openAIChat = open;
    window.closeAIChat = close;
    window.startAIChat = open;

    window.ArolanaSmartChat = {
        open,
        close,
        send,
        sendFromInput,
        requestAdmin,
        poll,
        resetConversation
    };

    window.ArolanaSmartChatNoRefresh = window.ArolanaSmartChat;

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bind);
    } else {
        bind();
    }
})();
</script>
