{% extends "base/auth_base.html" %}

{% block content %}
<section style="min-height:70vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;padding:40px 16px;">
  <div style="max-width:560px;width:100%;background:#fff;border-radius:24px;padding:40px;box-shadow:0 20px 60px rgba(15,45,107,.12);text-align:center;">
    <h1 style="color:#0F2D6B;font-size:32px;margin-bottom:12px;">Confirm Your Email</h1>
    <p style="color:#64748b;font-size:16px;line-height:1.7;">
      Click the button below to confirm your email address and activate your Arolana account.
    </p>

    <form method="post" style="margin-top:24px;">
      {% csrf_token %}
      <button type="submit" style="border:0;background:#FF7A00;color:white;padding:14px 24px;border-radius:14px;font-weight:700;font-size:16px;">
        Confirm Email Address
      </button>
    </form>

    <a href="/" style="display:inline-block;margin-top:18px;color:#0F2D6B;text-decoration:none;font-weight:700;">
      Back to Home
    </a>
  </div>
</section>
{% endblock %}
