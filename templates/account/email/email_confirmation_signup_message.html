<div style="font-family:Arial,sans-serif;max-width:600px;margin:auto;padding:24px;">
  <div style="text-align:center;margin-bottom:24px;">
    <img src="https://www.arolana.com/static/admin/images/arolana-logo.png" alt="Arolana" style="max-width:160px;">
  </div>

  <h2 style="color:#0F2D6B;">Confirm Your Email Address</h2>

  <p>Hello {{ user.username }},</p>

  <p>Welcome to Arolana. Please confirm your email address to activate your account.</p>

  <p>
    <a href="https://www.arolana.com{{ activate_url }}"
       style="background:#FF7A00;color:#fff;padding:14px 22px;border-radius:10px;text-decoration:none;font-weight:bold;display:inline-block;">
      Confirm Email Address
    </a>
  </p>

  <p>If the button does not work, copy and paste this link:</p>
  <p>
    <a href="https://www.arolana.com{{ activate_url }}">
      https://www.arolana.com{{ activate_url }}
    </a>
  </p>

  <p>Thank you,<br>The Arolana Team</p>
</div>
