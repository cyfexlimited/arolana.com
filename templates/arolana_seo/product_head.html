{% load arolana_seo %}
{% product_seo_title product as seo_title %}
{% product_seo_description product as seo_description %}
{% product_canonical_url product as canonical_url %}

<title>{{ seo_title }}</title>
<meta name="description" content="{{ seo_description }}">
<meta name="keywords" content="{{ product.meta_keywords|default:'' }}">
<link rel="canonical" href="{{ canonical_url }}">

<meta property="og:type" content="product">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ canonical_url }}">
{% if product.main_image %}
<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{{ product.main_image.url }}">
{% endif %}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">

<script type="application/ld+json">
{% product_schema_ld product "NGN" %}
</script>
