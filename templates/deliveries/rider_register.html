{% extends "base/base.html" %}

{% block title %}Register as Arolana Rider{% endblock %}

{% block content %}
<main class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-extrabold text-gray-900">Register as Arolana Rider</h1>
    <p class="mt-2 text-gray-600">Submit your rider details and KYC documents. Admin approval is required before deliveries can be accepted.</p>

    <form method="post" enctype="multipart/form-data" class="mt-8 grid gap-5 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
        {% csrf_token %}
        <label class="grid gap-2">
            <span class="font-bold text-gray-800">Rider type</span>
            <select name="rider_type" class="rounded-xl border border-gray-300 px-4 py-3">
                <option value="independent">Independent Dispatch Rider</option>
                <option value="arolana">Arolana Rider</option>
                <option value="vendor">Vendor Rider</option>
                <option value="admin_assigned">Admin Assigned Rider</option>
            </select>
        </label>
        <label class="grid gap-2">
            <span class="font-bold text-gray-800">Vehicle</span>
            <select name="vehicle" class="rounded-xl border border-gray-300 px-4 py-3">
                <option value="">Select vehicle</option>
                {% for vehicle in vehicles %}
                    <option value="{{ vehicle.id }}">{{ vehicle.name }}</option>
                {% endfor %}
            </select>
        </label>
        <div class="grid gap-5 md:grid-cols-2">
            <label class="grid gap-2">
                <span class="font-bold text-gray-800">Phone</span>
                <input name="phone" class="rounded-xl border border-gray-300 px-4 py-3" value="{{ rider.phone|default:'' }}">
            </label>
            <label class="grid gap-2">
                <span class="font-bold text-gray-800">Emergency phone</span>
                <input name="emergency_phone" class="rounded-xl border border-gray-300 px-4 py-3" value="{{ rider.emergency_phone|default:'' }}">
            </label>
        </div>
        <div class="grid gap-5 md:grid-cols-3">
            <label class="grid gap-2">
                <span class="font-bold text-gray-800">ID document</span>
                <input type="file" name="id_document" class="rounded-xl border border-gray-300 px-4 py-3">
            </label>
            <label class="grid gap-2">
                <span class="font-bold text-gray-800">Driver license</span>
                <input type="file" name="driver_license" class="rounded-xl border border-gray-300 px-4 py-3">
            </label>
            <label class="grid gap-2">
                <span class="font-bold text-gray-800">Vehicle document</span>
                <input type="file" name="vehicle_document" class="rounded-xl border border-gray-300 px-4 py-3">
            </label>
        </div>
        <button class="rounded-xl bg-blue-600 px-5 py-3 font-extrabold text-white">Submit Rider Profile</button>
    </form>
</main>
{% endblock %}
